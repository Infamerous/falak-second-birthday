<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<script>
  if (sessionStorage.getItem('falak_unlocked') !== 'true') {
    location.replace('index.html');
  }
</script>
<title>Falak</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Newsreader:ital,wght@0,400;1,400;1,500&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/birthday.css">
</head>
<body>
  <div class="grain"></div>
  <div class="progress-bar" id="progressBar"></div>
  <div class="star-field" id="starField"></div>

  <section class="section section-hero">
    <svg class="constellation" aria-hidden="true">
      <line x1="8%" y1="18%" x2="18%" y2="10%" />
      <line x1="18%" y1="10%" x2="27%" y2="20%" />
      <circle cx="8%" cy="18%" r="2" />
      <circle cx="18%" cy="10%" r="2" />
      <circle cx="27%" cy="20%" r="2" />
      <line x1="82%" y1="80%" x2="92%" y2="86%" />
      <line x1="92%" y1="86%" x2="88%" y2="94%" />
      <circle cx="82%" cy="80%" r="2" />
      <circle cx="92%" cy="86%" r="2" />
      <circle cx="88%" cy="94%" r="2" />
    </svg>

    <div class="chart reveal">
      <div class="ring-ticks"></div>
      <svg class="ring-label" viewBox="0 0 340 340" aria-hidden="true">
        <defs>
          <path id="ringPath" d="M 170,170 m -146,0 a 146,146 0 1,1 292,0 a 146,146 0 1,1 -292,0" />
        </defs>
        <text><textPath href="#ringPath"></textPath></text>
      </svg>

      <div class="chart-core">
        <p class="eyebrow">Happy Birthday</p>
        <h1>Falak</h1>
        <p class="meaning">"To two years of being a wonder and for the following years"</p>
      </div>
    </div>

    <div class="scroll-hint">
      <div class="thread"></div>
      <span>Scroll</span>
    </div>
  </section>

  <section class="section section-letter">
    <div class="letter reveal-stagger">
      <p>Keep being cute gangg!</p>
    </div>
  </section>

  <section class="section section-gallery">
    <p class="eyebrow reveal">GALLERY</p>
    <div class="marquee-row reveal">
      <div class="marquee-track to-left" id="marqueeTop"></div>
    </div>
    <div class="marquee-row reveal">
      <div class="marquee-track to-right" id="marqueeBottom"></div>
    </div>
  </section>

  <script src="assets/app.js"></script>
</body>
</html>
